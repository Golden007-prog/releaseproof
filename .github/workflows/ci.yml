name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the code. No secrets are used.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, build, test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      # pnpm version comes from "packageManager" in package.json.
      # No dependency cache on purpose: a poisoned cache was part of the TanStack attack.
      - name: Enable pnpm via Corepack
        run: corepack enable pnpm
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Smoke test CLI
        run: node packages/cli/dist/index.js --version
      # The action runs from its committed bundle; a stale one would ship old code.
      - name: Action bundle must be committed up to date
        run: |
          if ! git diff --exit-code --stat -- action/dist; then
            echo "::error::action/dist is stale: run 'pnpm build' and commit action/dist"
            exit 1
          fi
